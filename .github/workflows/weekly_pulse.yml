name: Weekly Groww Pulse

on:
  schedule:
    # Runs at 09:00 UTC every Monday (approx 2:30 PM IST)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Create Google Credentials JSON
        if: "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON != '' }}"
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > google_creds.json

      - name: Run GrowPulse Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: google_creds.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          # If GOOGLE_SHEET_ID is provided, prefer Sheets ingestion
          if [ -n "$GOOGLE_SHEET_ID" ]; then
            python -m growpulse --use-sheets --out-html dashboard.html
          else
            python -m growpulse --csv Data/reviews.csv --out-html dashboard.html
          fi

      - name: Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pulse-dashboard
          path: dashboard.html
