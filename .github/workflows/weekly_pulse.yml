name: Weekly Groww Pulse

on:
  schedule:
    # Runs at 09:00 UTC every Monday (approx 2:30 PM IST)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Create Google Credentials JSON
        env:
          GOOGLE_JSON_TEXT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_JSON_TEXT" ]; then
            echo "$GOOGLE_JSON_TEXT" > ${{ github.workspace }}/google_creds.json
            echo "GOOGLE_CREDS_EXIST=true" >> $GITHUB_ENV
          else
            echo "GOOGLE_CREDS_EXIST=false" >> $GITHUB_ENV
          fi

      - name: Run GrowPulse Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/google_creds.json
        run: |
          # Use Sheets if ID set and credentials exist, else fallback to CSV
          if [ "${{ env.GOOGLE_CREDS_EXIST }}" = "true" ] && [ -n "$GOOGLE_SHEET_ID" ]; then
            echo "Running with Google Sheets data source..."
            python -m growpulse --use-sheets --out-html dashboard.html --weeks 12
          else
            echo "Running with local CSV data source (Fallback or default)..."
            python -m growpulse --csv Data/reviews.csv --out-html dashboard.html --weeks 12
          fi

      - name: Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-pulse-dashboard
          path: dashboard.html

